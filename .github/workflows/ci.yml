name: CI

on:
  push:
    branches: [next]
  pull_request:
    branches: [next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and browser regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/frontend/package-lock.json
            tests/ci/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --prefix web/frontend
          npm ci --prefix tests/ci
      - name: Validate checked-in offline assets
        run: node tests/ci/check-assets.mjs
      - name: Test shared color contract guard
        run: npm run test:colors --prefix web/frontend
      - name: Typecheck and build production assets
        run: npm run build --prefix web/frontend
      - name: Validate rebuilt offline assets
        run: node tests/ci/check-assets.mjs
      - name: Share fresh frontend assets with Go tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-assets
          path: web/assets/
          include-hidden-files: true # The Vite manifest lives in .vite/.
          retention-days: 1
      - name: Test release obfuscation
        run: npm run test:obfuscation --prefix web/frontend
      - name: Test Markdown, cards and request coordination
        run: node tests/ci/frontend.mjs unit
      - name: Install isolated Chromium
        run: ./tests/ci/node_modules/.bin/playwright install --with-deps chromium
      - name: Test isolated browser behavior
        run: node tests/ci/frontend.mjs browser
      - name: Upload synthetic browser reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-reports
          path: tests/artifacts/ci/browser/
          if-no-files-found: ignore
          retention-days: 7

  go:
    name: Go and PostgreSQL 18
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: painter_ci
          POSTGRES_DB: postgres
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
          # Disposable runner-only service; no application or production secrets.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U painter_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_BIN_DIR: /usr/lib/postgresql/18/bin
      PAINTER_TEST_APPLE_LIVE: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Clear checked-in assets before downloading the tested build
        run: rm -rf web/assets
      - name: Use frontend assets from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-assets
          path: web/assets/
      - name: Install PostgreSQL 18 backup tools
        shell: bash
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error --retry 3 https://www.postgresql.org/media/keys/ACCC4CF8.asc |
            sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' |
            sudo tee /etc/apt/sources.list.d/painter-pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-18
      - name: Require a live PostgreSQL 18 test cluster and matching tools
        shell: bash
        env:
          TEST_POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          export PAINTER_TEST_DATABASE_URL="host=127.0.0.1 port=$TEST_POSTGRES_PORT user=painter_ci dbname=postgres sslmode=disable"
          echo "PAINTER_TEST_DATABASE_URL=$PAINTER_TEST_DATABASE_URL" >> "$GITHUB_ENV"
          : "${PAINTER_TEST_DATABASE_URL:?Test database is required}"
          version=$("$POSTGRES_BIN_DIR/psql" "$PAINTER_TEST_DATABASE_URL" -XAtc 'SHOW server_version_num')
          [[ "$version" =~ ^18[0-9]{4}$ ]]
          "$POSTGRES_BIN_DIR/pg_dump" --version
          "$POSTGRES_BIN_DIR/pg_restore" --version
      - name: Verify modules and static checks
        run: |
          go mod verify
          go vet ./...
      - name: Test all packages with race detection and real PostgreSQL
        run: go test -race -count=1 -timeout=20m -coverprofile="$RUNNER_TEMP/go-coverage.out" ./...
      - name: Build standalone server
        run: make build
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          path: ${{ runner.temp }}/go-coverage.out
          if-no-files-found: ignore
          retention-days: 7

  tools:
    name: Deployment and backup contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test deployment scripts without a real Docker deployment
        run: python3 -m unittest discover -s tests/deploy -v
      - name: Test backup and recovery tooling
        run: python3 -m unittest discover -s tests/backup -v
