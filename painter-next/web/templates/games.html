{{define "games-page"}}
<section class="games-library" aria-labelledby="games-title">
 <header class="games-library-heading"><div><a class="games-home-link" href="/#home-steam">回到首页游戏墙</a><h1 id="games-title">游戏墙</h1><p>{{.ResultCount}} 款游戏，走进去的世界。</p></div><nav class="games-sort" aria-label="游戏排序"><a href="/games?sort=position" {{if or (eq (.Query.Get "sort") "position") (eq (.Query.Get "sort") "")}}aria-current="page"{{end}}>展示顺序</a><a href="/games?sort=playtime" {{if eq (.Query.Get "sort") "playtime"}}aria-current="page"{{end}}>游玩时长</a><a href="/games?sort=title" {{if eq (.Query.Get "sort") "title"}}aria-current="page"{{end}}>名称</a></nav></header>
 <div class="games-library-grid">{{range .Items}}<article class="game-library-card"><a class="game-library-open" href="{{.url}}" target="_blank" rel="noopener" aria-label="在 Steam 查看 {{.title}}"><div class="game-library-art"><span class="home-art-fallback" aria-hidden="true">{{.title}}</span><img src="{{.poster_url}}" data-fallback="{{.image_url}}" alt="{{if .alt}}{{.alt}}{{else}}{{.title}}{{end}}" loading="lazy" decoding="async" data-library-cover><span class="game-library-visit" aria-hidden="true">在 Steam 查看 {{template "home-arrow"}}</span></div><div class="game-library-details"><h2>{{.title}}</h2><p>{{gameHours .playtime_minutes}}</p></div></a></article>{{else}}<div class="games-empty"><h2>新的世界，慢慢收集。</h2><p>公开展示的游戏会出现在这里。</p></div>{{end}}</div>
</section>
{{end}}
